<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Gallery</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<h1 class="title">Image Gallery</h1>

<div class="gallery">

    <div class="card">
        <img src="images/img1.jpg" onclick="openImage(this)">
    </div>

    <div class="card">
        <img src="images/img2.jpg" onclick="openImage(this)">
    </div>

    <div class="card">
        <img src="images/img3.jpg" onclick="openImage(this)">
    </div>

    <div class="card">
        <img src="images/img4.jpg" onclick="openImage(this)">
    </div>

</div>

<div id="preview">
    <span onclick="closeImage()">X</span>
    <img id="previewImg">
</div>

<script src="js/script.js"></script>

</body>
</html>
